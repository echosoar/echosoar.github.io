                <a href="#" class="back-to-top" aria-label="返回顶部" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">↑</a>
            </body>
            <script>
                window.addEventListener('scroll', () => {
                    document.body.classList.toggle('scrolled', window.scrollY > 300);
                });

                const galleryPreview = document.querySelector('.gallery-preview');
                if (galleryPreview instanceof HTMLDialogElement) {
                    const previewImage = galleryPreview.querySelector('.gallery-preview-image');
                    const previewCaption = galleryPreview.querySelector('.gallery-preview-caption');
                    const closeButton = galleryPreview.querySelector('.gallery-preview-close');

                    document.addEventListener('click', (event) => {
                        if (!(event.target instanceof Element)) {
                            return;
                        }
                        const trigger = event.target.closest('.gallery-image-button');
                        if (!trigger) {
                            return;
                        }
                        const image = trigger.querySelector('img');
                        if (!(image instanceof HTMLImageElement) || !(previewImage instanceof HTMLImageElement)) {
                            return;
                        }
                        const caption = trigger.parentElement?.querySelector('.gallery-caption')?.textContent || image.alt;
                        previewImage.src = image.currentSrc || image.src;
                        previewImage.alt = image.alt;
                        if (previewCaption) {
                            previewCaption.textContent = caption;
                        }
                        galleryPreview.showModal();
                    });

                    closeButton?.addEventListener('click', () => galleryPreview.close());
                    galleryPreview.addEventListener('click', (event) => {
                        if (event.target === galleryPreview) {
                            galleryPreview.close();
                        }
                    });
                }
            </script>
            </html>
