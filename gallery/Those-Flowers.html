            <script>
                window.addEventListener('scroll', () => {
                    document.body.classList.toggle('scrolled', window.scrollY > 300);
                });

                const getWrappedIndex = (index, length) => (index + length) % length;
                const updateGalleryCard = (card, nextIndex) => {
                    const track = card.querySelector('.gallery-carousel-track');
                    const slides = Array.from(card.querySelectorAll('.gallery-image-button, .gallery-image-link'));
                    if (!(track instanceof HTMLElement) || slides.length === 0) {
                        return;
                    }
                    const index = getWrappedIndex(nextIndex, slides.length);
                    card.dataset.galleryIndex = String(index);
                    track.style.transform = 'translateX(-' + (index * 100) + '%)';
                    slides.forEach((slide, slideIndex) => {
                        slide.setAttribute('aria-hidden', String(slideIndex !== index));
                        if (slide instanceof HTMLElement) {
                            slide.tabIndex = slideIndex === index ? 0 : -1;
                        }
                    });
                    card.querySelectorAll('.gallery-carousel-dot').forEach((dot, dotIndex) => {
                        dot.classList.toggle('is-active', dotIndex === index);
                        dot.setAttribute('aria-current', dotIndex === index ? 'true' : 'false');
                    });
                    const status = card.querySelector('.gallery-carousel-status');
                    if (status) {
                        status.textContent = '第 ' + (index + 1) + ' 张，共 ' + slides.length + ' 张';
                    }
                };
                const moveGalleryCard = (card, delta) => {
                    const currentIndex = Number(card.dataset.galleryIndex || 0);
                    updateGalleryCard(card, currentIndex + delta);
                };
                const addGallerySwipe = (element, onSwipe) => {
                    let startX = 0;
                    let startY = 0;
                    element.addEventListener('touchstart', (event) => {
                        const touch = event.touches[0];
                        if (!touch) {
                            return;
                        }
                        startX = touch.clientX;
                        startY = touch.clientY;
                    }, { passive: true });
                    element.addEventListener('touchend', (event) => {
                        const touch = event.changedTouches[0];
                        if (!touch) {
                            return;
                        }
                        const offsetX = touch.clientX - startX;
                        const offsetY = touch.clientY - startY;
                        if (Math.abs(offsetX) >= 40 && Math.abs(offsetX) > Math.abs(offsetY)) {
                            onSwipe(offsetX < 0 ? 1 : -1);
                        }
                    }, { passive: true });
                };

                document.querySelectorAll('.gallery-card').forEach((card) => {
                    if (!(card instanceof HTMLElement)) {
                        return;
                    }
                    updateGalleryCard(card, 0);
                    card.querySelector('.gallery-carousel-prev')?.addEventListener('click', () => moveGalleryCard(card, -1));
                    card.querySelector('.gallery-carousel-next')?.addEventListener('click', () => moveGalleryCard(card, 1));
                    card.querySelectorAll('.gallery-carousel-dot').forEach((dot, index) => {
                        dot.addEventListener('click', () => updateGalleryCard(card, index));
                    });
                    const carousel = card.querySelector('.gallery-carousel');
                    const slideCount = card.querySelectorAll('.gallery-image-button, .gallery-image-link').length;
                    if (carousel && slideCount > 1) {
                        addGallerySwipe(carousel, (delta) => {
                            card.dataset.gallerySwiped = 'true';
                            moveGalleryCard(card, delta);
                            window.setTimeout(() => delete card.dataset.gallerySwiped, 350);
                        });
                    }
                });

                const galleryPreview = document.querySelector('.gallery-preview');
                let previewImages = [];
                let previewIndex = 0;
                let previewCaptionText = '';
                const renderGalleryPreview = () => {
                    if (!(galleryPreview instanceof HTMLDialogElement) || previewImages.length === 0) {
                        return;
                    }
                    previewIndex = getWrappedIndex(previewIndex, previewImages.length);
                    const image = previewImages[previewIndex];
                    const previewImage = galleryPreview.querySelector('.gallery-preview-image');
                    const previewCaption = galleryPreview.querySelector('.gallery-preview-caption');
                    if (previewImage instanceof HTMLImageElement) {
                        previewImage.src = image.src;
                        previewImage.alt = image.alt;
                    }
                    if (previewCaption) {
                        previewCaption.textContent = previewCaptionText;
                    }
                    galleryPreview.querySelectorAll('.gallery-preview-control').forEach((control) => {
                        if (control instanceof HTMLElement) {
                            control.hidden = previewImages.length <= 1;
                        }
                    });
                };
                const moveGalleryPreview = (delta) => {
                    previewIndex += delta;
                    renderGalleryPreview();
                };

                if (galleryPreview instanceof HTMLDialogElement) {
                    galleryPreview.querySelector('.gallery-preview-close')?.addEventListener('click', () => galleryPreview.close());
                    galleryPreview.querySelector('.gallery-preview-prev')?.addEventListener('click', () => moveGalleryPreview(-1));
                    galleryPreview.querySelector('.gallery-preview-next')?.addEventListener('click', () => moveGalleryPreview(1));
                    const previewStage = galleryPreview.querySelector('.gallery-preview-stage');
                    if (previewStage) {
                        addGallerySwipe(previewStage, moveGalleryPreview);
                    }
                    galleryPreview.addEventListener('click', (event) => {
                        if (event.target === galleryPreview) {
                            galleryPreview.close();
                        }
                    });
                }

                const galleryInfoDialog = document.querySelector('.gallery-info-dialog');
                if (galleryInfoDialog instanceof HTMLDialogElement) {
                    galleryInfoDialog.querySelector('.gallery-info-close')?.addEventListener('click', () => galleryInfoDialog.close());
                    galleryInfoDialog.addEventListener('click', (event) => {
                        if (event.target === galleryInfoDialog) {
                            galleryInfoDialog.close();
                        }
                    });
                }

                document.addEventListener('click', (event) => {
                    if (!(event.target instanceof Element)) {
                        return;
                    }
                    const swipedLink = event.target.closest('.gallery-image-link');
                    const swipedCard = swipedLink?.closest('.gallery-card');
                    if (swipedCard instanceof HTMLElement && swipedCard.dataset.gallerySwiped === 'true') {
                        event.preventDefault();
                        return;
                    }

                    const infoTrigger = event.target.closest('.gallery-info-button');
                    if (infoTrigger && galleryInfoDialog instanceof HTMLDialogElement) {
                        const card = infoTrigger.closest('.gallery-card');
                        const source = card?.querySelector('.gallery-info-source');
                        const title = card?.querySelector('.gallery-caption')?.textContent || '';
                        const infoTitle = galleryInfoDialog.querySelector('.gallery-info-title');
                        const infoContent = galleryInfoDialog.querySelector('.gallery-info-content');
                        if (infoTitle) {
                            infoTitle.textContent = title;
                        }
                        if (infoContent) {
                            infoContent.textContent = source?.textContent || '';
                        }
                        galleryInfoDialog.showModal();
                        return;
                    }

                    const trigger = event.target.closest('.gallery-image-button');
                    if (!trigger || !(galleryPreview instanceof HTMLDialogElement)) {
                        return;
                    }
                    const card = trigger.closest('.gallery-card');
                    if (!(card instanceof HTMLElement)) {
                        return;
                    }
                    if (card.dataset.gallerySwiped === 'true') {
                        event.preventDefault();
                        return;
                    }
                    const triggers = Array.from(card.querySelectorAll('.gallery-image-button'));
                    previewImages = triggers.map((item) => {
                        const image = item.querySelector('img');
                        return {
                            src: image instanceof HTMLImageElement ? (image.currentSrc || image.src) : '',
                            alt: image instanceof HTMLImageElement ? image.alt : '',
                        };
                    }).filter((image) => image.src);
                    previewIndex = Math.max(0, triggers.indexOf(trigger));
                    previewCaptionText = card.querySelector('.gallery-caption')?.textContent || '';
                    renderGalleryPreview();
                    galleryPreview.showModal();
                });

                document.addEventListener('keydown', (event) => {
                    if (!(galleryPreview instanceof HTMLDialogElement) || !galleryPreview.open) {
                        return;
                    }
                    if (event.key === 'ArrowLeft') {
                        moveGalleryPreview(-1);
                    } else if (event.key === 'ArrowRight') {
                        moveGalleryPreview(1);
                    }
                });
            </script>
