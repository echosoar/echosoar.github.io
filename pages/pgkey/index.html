<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>党政文章关键词</title>
  <style>
    :root {
      --ink: rgba(0, 0, 0, 0.92);
      --muted-ink: rgba(0, 0, 0, 0.52);
      --faint-ink: rgba(0, 0, 0, 0.14);
      --wash: rgba(0, 0, 0, 0.035);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    main {
      width: min(100% - 48px, 960px);
      margin: 0 auto;
      padding: 72px 0;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 42px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 44px);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    #result-count {
      margin: 0;
      color: var(--muted-ink);
      font-size: 13px;
      white-space: nowrap;
    }

    .filter-area {
      display: grid;
      gap: 17px;
      margin-bottom: 42px;
    }

    .filter-label {
      color: var(--muted-ink);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
    }

    .filter {
      appearance: none;
      padding: 0 0 3px;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--muted-ink);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
    }

    .filter[aria-pressed="true"] {
      border-bottom-color: var(--ink);
      color: var(--ink);
    }

    .filter:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 4px;
    }

    #word-cloud {
      display: block;
      width: 100%;
      height: 320px;
      margin-bottom: 42px;
    }

    .table-wrap { min-height: 180px; }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead { border-bottom: 1px solid var(--ink); }

    th, td { text-align: left; }

    th {
      padding: 0 0 13px;
      color: var(--muted-ink);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    th:last-child, td:last-child {
      width: 27%;
      text-align: right;
    }

    tbody tr { border-bottom: 1px solid var(--faint-ink); }

    td { padding: 12px 0; }

    td:first-child {
      font-size: 16px;
      letter-spacing: 0.01em;
    }

    td:last-child {
      color: var(--muted-ink);
      font-variant-numeric: tabular-nums;
    }

    .message {
      margin: 0;
      padding: 26px 0;
      color: var(--muted-ink);
      border-bottom: 1px solid var(--faint-ink);
    }

    .error { color: var(--ink); }

    @media (max-width: 560px) {
      main {
        width: min(100% - 32px, 960px);
        padding-top: 56px;
      }

      header { margin-bottom: 48px; }
      .filters { gap: 8px 15px; }
      th:last-child, td:last-child { width: 32%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>党政文章关键词</h1>
      <p id="result-count" aria-live="polite">Loading...</p>
    </header>

    <section class="filter-area" aria-label="关键词筛选">
      <div class="filter-group">
        <div class="filters" id="year-filters" aria-label="年份筛选"></div>
      </div>
      <div class="filter-group">
        <div class="filters" id="filters" aria-label="关键词长度筛选"></div>
      </div>
      <div class="filter-group">
        <div class="filters" id="pos-filters" aria-label="关键词词性筛选"></div>
      </div>
    </section>

    <section id="word-cloud-wrap" aria-label="关键词词云" hidden>
      <canvas id="word-cloud" role="img" aria-label="当前筛选关键词词云"></canvas>
    </section>

    <section class="table-wrap" aria-label="关键词列表">
      <table>
        <thead>
          <tr><th scope="col">关键词</th><th scope="col">词性</th><th scope="col">数量</th></tr>
        </thead>
        <tbody id="keyword-list">
          <tr><td class="message" colspan="3">正在读取关键词数据…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
  <script>
    (() => {
      const DATA_URL = 'https://data.mdcsv.com/datasets/keywords.json';
      const yearFilters = document.querySelector('#year-filters');
      const filters = document.querySelector('#filters');
      const posFilters = document.querySelector('#pos-filters');
      const wordCloudWrap = document.querySelector('#word-cloud-wrap');
      const wordCloud = document.querySelector('#word-cloud');
      const keywordList = document.querySelector('#keyword-list');
      const resultCount = document.querySelector('#result-count');
      let yearlyKeywords = [];
      let selectedYears = new Set();
      let selectedLengths = new Set();
      let selectedPoses = new Set();

      const escapeHTML = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      const wordLength = (word) => word.replace(/\s/g, '').length;
      const normalizePos = (pos) => typeof pos === 'string' ? pos : '';
      const posMatches = (pos, selectedPoses) => {
        const poses = pos.split('/').map((item) => item.trim()).filter(Boolean);
        return poses.length
          ? poses.some((item) => selectedPoses.has(item))
          : selectedPoses.has('');
      };

      function getKeywordsForSelectedYears() {
        const countsByWordAndPos = new Map();

        yearlyKeywords
          .filter(({ year }) => selectedYears.size === 0 || selectedYears.has(year))
          .forEach(({ words }) => {
            words.forEach(({ word, count, pos }) => {
              const key = `${word}\u0000${pos}`;
              const keyword = countsByWordAndPos.get(key) || { word, pos, count: 0 };
              keyword.count += count;
              countsByWordAndPos.set(key, keyword);
            });
          });

        return Array.from(countsByWordAndPos.values())
          .sort((a, b) => b.count - a.count || a.word.localeCompare(b.word, 'zh-CN') || a.pos.localeCompare(b.pos));
      }

      function renderYearFilters() {
        const years = [...new Set(yearlyKeywords.map(({ year }) => year))].sort((a, b) => b - a);
        yearFilters.innerHTML = [
          `<button class="filter" type="button" data-all="true" aria-pressed="${selectedYears.size === 0}">全部年份</button>`,
          ...years.map((year) => `<button class="filter" type="button" data-year="${year}" aria-pressed="${selectedYears.has(year)}">${year}年</button>`)
        ].join('');
      }

      function renderLengthFilters(keywords) {
        const lengths = [...new Set(keywords.map(({ word }) => wordLength(word)))].sort((a, b) => a - b);
        selectedLengths.forEach((length) => {
          if (!lengths.includes(length)) selectedLengths.delete(length);
        });

        filters.innerHTML = [
          `<button class="filter" type="button" data-all="true" aria-pressed="${selectedLengths.size === 0}">全部长度</button>`,
          ...lengths.map((length) => `<button class="filter" type="button" data-length="${length}" aria-pressed="${selectedLengths.has(length)}">长度${length}</button>`)
        ].join('');
      }

      function renderPosFilters() {
        const posOptions = [
          ['n', '名词'],
          ['v', '动词'],
          ['a', '形容词'],
          ['u', '助词'],
          ['d', '副词'],
          ['vt', '动宾'],
          ['f', '方位词'],
          ['', '其他']
        ];

        posFilters.innerHTML = [
          `<button class="filter" type="button" data-all="true" aria-pressed="${selectedPoses.size === 0}">全部词性</button>`,
          ...posOptions.map(([pos, label]) => `<button class="filter" type="button" data-pos="${pos}" aria-pressed="${selectedPoses.has(pos)}">${label}</button>`)
        ].join('');
      }

      function renderTable(keywords) {
        const visibleKeywords = keywords.filter(({ word, pos }) =>
          (selectedLengths.size === 0 || selectedLengths.has(wordLength(word))) &&
          (selectedPoses.size === 0 || posMatches(pos, selectedPoses))
        );

        resultCount.textContent = `共 ${visibleKeywords.length} 个`;
        keywordList.innerHTML = visibleKeywords.length
          ? visibleKeywords.map(({ word, pos, count }) => `\n            <tr><td>${escapeHTML(word)}</td><td>${escapeHTML(pos)}</td><td>${escapeHTML(count)}</td></tr>`).join('')
          : '<tr><td class="message" colspan="3">暂无符合条件的关键词</td></tr>';

        wordCloudWrap.hidden = visibleKeywords.length <= 20 || typeof window.WordCloud !== 'function';
        if (!wordCloudWrap.hidden) {
          const countsByWord = new Map();
          visibleKeywords.forEach(({ word, count }) => {
            countsByWord.set(word, (countsByWord.get(word) || 0) + count);
          });
          wordCloud.width = wordCloudWrap.clientWidth;
          wordCloud.height = 320;
          window.WordCloud(wordCloud, {
            list: Array.from(countsByWord, ([word, count]) => [word, count]),
            weightFactor: (weight) => 12 + Math.log2(Math.max(weight, 1)) * 5,
            backgroundColor: '#fff'
          });
        }
      }

      function renderKeywords() {
        const keywords = getKeywordsForSelectedYears();
        renderLengthFilters(keywords);
        renderPosFilters();
        renderTable(keywords);
      }

      yearFilters.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        if (button.dataset.all) {
          selectedYears.clear();
        } else {
          const year = Number(button.dataset.year);
          selectedYears.has(year) ? selectedYears.delete(year) : selectedYears.add(year);
        }

        renderYearFilters();
        renderKeywords();
      });

      filters.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        if (button.dataset.all) {
          selectedLengths.clear();
        } else {
          const length = Number(button.dataset.length);
          selectedLengths.has(length) ? selectedLengths.delete(length) : selectedLengths.add(length);
        }

        renderKeywords();
      });

      posFilters.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        if (button.dataset.all) {
          selectedPoses.clear();
        } else {
          const pos = button.dataset.pos;
          selectedPoses.has(pos) ? selectedPoses.delete(pos) : selectedPoses.add(pos);
        }

        renderKeywords();
      });

      async function loadKeywords() {
        try {
          const response = await fetch(DATA_URL);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const data = await response.json();
          if (!Array.isArray(data.list)) throw new Error('数据格式无效');

          yearlyKeywords = data.list
            .filter((item) => Number.isInteger(Number(item?.year)) && Array.isArray(item?.words))
            .map(({ year, words }) => ({
              year: Number(year),
              words: words
                .filter((item) => typeof item?.word === 'string' && Number.isFinite(Number(item?.count)))
                .map(({ word, count, pos }) => ({ word, count: Number(count), pos: normalizePos(pos) }))
            }));

          renderYearFilters();
          renderKeywords();
        } catch (error) {
          resultCount.textContent = '读取失败';
          keywordList.innerHTML = '<tr><td class="message error" colspan="3">关键词数据暂时无法读取，请稍后再试。</td></tr>';
          console.error('无法读取关键词数据：', error);
        }
      }

      loadKeywords();
    })();
  </script>
</body>
</html>
