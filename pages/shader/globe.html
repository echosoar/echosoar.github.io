<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globe</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #0b0e14;
    transition: background 0.3s ease;
  }
  [data-theme="light"] body { background: #fffbf5; }

  #globe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  #globe.dragging { cursor: grabbing; }

  #mode-switch {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(10, 14, 20, 0.35);
    backdrop-filter: blur(6px);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }
  [data-theme="light"] #mode-switch {
    border-color: rgba(20, 30, 45, 0.25);
    background: rgba(255, 255, 255, 0.35);
    color: #1a2433;
  }
  #mode-switch:hover { border-color: rgba(255, 255, 255, 0.6); }
  [data-theme="light"] #mode-switch:hover { border-color: rgba(20, 30, 45, 0.5); }

  #mode-switch svg {
    width: 20px;
    height: 20px;
    grid-area: 1 / 1;
  }
  [data-theme="light"] .glyph-night { display: none; }
  [data-theme="dark"] .glyph-day { display: none; }
</style>
</head>
<body>
<canvas id="globe"></canvas>
<button id="mode-switch" type="button" aria-label="切换亮暗模式">
  <svg class="glyph-day" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </svg>
  <svg class="glyph-night" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

// ---- 数学工具 ---------------------------------------------------------------
// 经纬度 -> 单位球面坐标（原版 wc / fe）
function latLonToVec3(lat, lon, r) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return [
    -r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta),
  ];
}

const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const clamp01 = (t) => Math.max(0, Math.min(1, t));

function perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2);
  const nf = 1 / (near - far);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) * nf, -1,
    0, 0, 2 * far * near * nf, 0,
  ]);
}

function lookAt(eye, target, up) {
  let zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
  let len = Math.hypot(zx, zy, zz);
  zx /= len; zy /= len; zz /= len;
  let xx = up[1] * zz - up[2] * zy;
  let xy = up[2] * zx - up[0] * zz;
  let xz = up[0] * zy - up[1] * zx;
  len = Math.hypot(xx, xy, xz);
  xx /= len; xy /= len; xz /= len;
  const yx = zy * xz - zz * xy;
  const yy = zz * xx - zx * xz;
  const yz = zx * xy - zy * xx;
  return new Float32Array([
    xx, yx, zx, 0,
    xy, yy, zy, 0,
    xz, yz, zz, 0,
    -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
    -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
    -(zx * eye[0] + zy * eye[1] + zz * eye[2]),
    1,
  ]);
}

// ---- 几何构建 ---------------------------------------------------------------
// 经线（原版 qL）：固定经度，纬度 -90..90
function meridian(lon, r) {
  const pts = [];
  for (let lat = -90; lat <= 90; lat += 1) pts.push(...latLonToVec3(lat, lon, r));
  return pts;
}

// 纬线（原版 ny）：固定纬度，经度 -180..180
function parallel(lat, r) {
  const pts = [];
  for (let lon = -180; lon <= 180; lon += 1) pts.push(...latLonToVec3(lat, lon, r));
  return pts;
}

// 斜交大圆（原版 YL）：绕 Y 轴倾斜 v 的大圆
function diagonal(v, r) {
  const pts = [];
  for (let d = 0; d <= 360; d += 2) {
    const i = d * Math.PI / 180;
    pts.push(r * Math.sin(i) * Math.cos(v), r * Math.cos(i), r * Math.sin(i) * Math.sin(v));
  }
  return pts;
}

// 两点之间的弧线（原版 F）：球面插值 + 向外鼓出
function arcPoints(a, b) {
  const o = latLonToVec3(a.lat, a.lon, 1);
  const i = latLonToVec3(b.lat, b.lon, 1);
  const pts = [];
  const SEG = 20;
  for (let d = 0; d <= SEG; d++) {
    const h = d / SEG;
    const n = -h * h + h;
    let m = [
      o[0] * (1 - h) + i[0] * h,
      o[1] * (1 - h) + i[1] * h,
      o[2] * (1 - h) + i[2] * h,
    ];
    const len = Math.hypot(m[0], m[1], m[2]) || 1;
    const lift = n * 0.3;
    m = [m[0] + (m[0] / len) * lift, m[1] + (m[1] / len) * lift, m[2] + (m[2] / len) * lift];
    pts.push(...m);
  }
  return pts;
}

// 弧线连接关系（原版 ba：user->worker，worker->r2）
function buildArcs() {
  const arcs = [];
  const inGroup = (g, t) => POIS.filter((p) => p.group === g && p.iconType === t);
  for (const [infra, groups] of Object.entries(INFRA_LINKS)) {
    const workers = inGroup(infra, 'productWorkers');
    const r2s = inGroup(infra, 'productR2');
    for (const g of groups) {
      for (const user of inGroup(g, 'user2')) {
        for (const w of workers) arcs.push(arcPoints(user, w));
      }
    }
    for (const w of workers) {
      for (const r of r2s) arcs.push(arcPoints(w, r));
    }
  }
  return arcs;
}

// ---- 着色器 ------------------------------------------------------------------
const VERT_SRC = `
  attribute vec3 aPos;
  uniform mat4 uProj;
  uniform mat4 uView;
  uniform float uYaw;        // 绕垂直 Y 轴的自转角（地轴无倾角）
  uniform float uScale;
  uniform float uYOffset;
  uniform vec3 uCamera;
  uniform float uPixelScale; // viewportHeight / (2 * tan(fov/2))
  uniform float uPointSize;  // 0 表示画线
  varying float vFace;
  void main() {
    vec3 p = aPos * uScale;
    float c = cos(uYaw);
    float s = sin(uYaw);
    p = vec3(c * p.x + s * p.z, p.y, c * p.z - s * p.x);
    vec3 world = p + vec3(0.0, uYOffset, 0.0);
    vec3 toCam = uCamera - world;
    float dist = length(toCam);
    // 球面法线即位置方向；带符号，背面半球以 uBackFade 的透明度透出虚影
    vFace = dot(normalize(p), toCam / dist);
    gl_Position = uProj * uView * vec4(world, 1.0);
    gl_PointSize = uPointSize * uPixelScale / dist;
  }
`;

const FRAG_POINT = `
  precision mediump float;
  uniform vec4 uColor;
  uniform float uBackFade; // 背面半球的透明度比例（虚影感）
  varying float vFace;
  void main() {
    vec2 d = gl_PointCoord - 0.5;
    if (dot(d, d) > 0.25) discard;
    float vis = mix(uBackFade, 1.0, smoothstep(-0.6, 0.3, vFace));
    gl_FragColor = vec4(uColor.rgb, uColor.a * vis);
  }
`;

const FRAG_LINE = `
  precision mediump float;
  uniform vec4 uColor;
  uniform float uBackFade;
  varying float vFace;
  void main() {
    float vis = mix(uBackFade, 1.0, smoothstep(-0.6, 0.3, vFace));
    gl_FragColor = vec4(uColor.rgb, uColor.a * vis);
  }
`;

// ---- 主题切换（参照 wave.html） -------------------------------------------------
const STORAGE_SLOT = 'globe-theme-mode';

class ThemeSwitch {
  constructor(button) {
    this.button = button;
    this.dark = this.restore();
    this.paint();
    button.addEventListener('click', () => this.flip());
  }

  restore() {
    let saved = null;
    try { saved = localStorage.getItem(STORAGE_SLOT); } catch (e) {}
    if (saved === 'night') return true;
    if (saved === 'day') return false;
    const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    return !!(mq && mq.matches);
  }

  flip() {
    this.dark = !this.dark;
    try { localStorage.setItem(STORAGE_SLOT, this.dark ? 'night' : 'day'); } catch (e) {}
    this.paint();
  }

  paint() {
    document.documentElement.dataset.theme = this.dark ? 'dark' : 'light';
  }
}

// ---- 渲染器 -------------------------------------------------------------------
class GlobeApp {
  constructor(canvas, switcher) {
    this.canvas = canvas;
    this.switcher = switcher;
    this.gl = canvas.getContext('webgl', { antialias: true, alpha: false });
    if (!this.gl) throw new Error('WebGL not supported');

    this.progPoint = this.link(VERT_SRC, FRAG_POINT);
    this.progLine = this.link(VERT_SRC, FRAG_LINE);

    this.buffers = this.buildBuffers();

    this.yaw = 0;
    this.dragging = false;
    this.lastX = 0;
    this.resumeAt = 0;
    this.prevStamp = null;

    this.fit();
    window.addEventListener('resize', () => this.fit());
    this.bindPointer();
  }

  compile(type, src) {
    const { gl } = this;
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader) || 'shader compile failed');
    }
    return shader;
  }

  link(vertSrc, fragSrc) {
    const { gl } = this;
    const program = gl.createProgram();
    gl.attachShader(program, this.compile(gl.VERTEX_SHADER, vertSrc));
    gl.attachShader(program, this.compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || 'program link failed');
    }
    const uniform = (name) => gl.getUniformLocation(program, name);
    return {
      program,
      aPos: gl.getAttribLocation(program, 'aPos'),
      uProj: uniform('uProj'),
      uView: uniform('uView'),
      uYaw: uniform('uYaw'),
      uScale: uniform('uScale'),
      uYOffset: uniform('uYOffset'),
      uCamera: uniform('uCamera'),
      uPixelScale: uniform('uPixelScale'),
      uPointSize: uniform('uPointSize'),
      uColor: uniform('uColor'),
      uBackFade: uniform('uBackFade'),
    };
  }

  makeBuffer(data) {
    const { gl } = this;
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
    return buf;
  }

  buildBuffers() {
    // 陆地点
    const raw = atob(LAND_B64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const ints = new Int16Array(bytes.buffer);
    const land = [];
    const count = Math.min(16098, Math.floor(ints.length / 3));
    for (let i = 0; i < count; i++) {
      land.push(
        (ints[i * 3] / 32767) * GLOBE_RADIUS,
        (ints[i * 3 + 1] / 32767) * GLOBE_RADIUS,
        (ints[i * 3 + 2] / 32767) * GLOBE_RADIUS,
      );
    }

    // 经纬网格：24 条经线 + 23 条纬线（原版参数），赤道单独加亮
    const grid = { buf: null, strips: [] };
    const gridData = [];
    for (let b = 0; b < 24; b++) {
      const lon = -180 + (360 / 24) * b;
      const pts = meridian(lon, GRID_RADIUS);
      grid.strips.push({ start: gridData.length / 3, count: pts.length / 3 });
      gridData.push(...pts);
    }
    for (let b = 0; b < 23; b++) {
      const lat = -90 + (180 / 24) * (b + 1);
      if (Math.abs(lat) < 5) continue;
      const pts = parallel(lat, GRID_RADIUS);
      grid.strips.push({ start: gridData.length / 3, count: pts.length / 3 });
      gridData.push(...pts);
    }
    grid.buf = this.makeBuffer(gridData);

    const equator = { buf: this.makeBuffer(parallel(0, GRID_RADIUS)), count: 361 };

    // 12 条斜交大圆
    const diag = { buf: null, strips: [] };
    const diagData = [];
    for (let b = 0; b < 12; b++) {
      const pts = diagonal(b * 30 * Math.PI / 180, GRID_RADIUS);
      diag.strips.push({ start: diagData.length / 3, count: pts.length / 3 });
      diagData.push(...pts);
    }
    diag.buf = this.makeBuffer(diagData);

    // 连接弧线（带相位错开的生长动画）
    const arcs = buildArcs().map((pts, idx) => ({
      buf: this.makeBuffer(pts),
      count: pts.length / 3,
      phase: (idx * 0.37) % 1,
      duration: 3 + (idx % 5) * 0.4,
    }));

    // POI 标记点
    const poi = { buf: this.makeBuffer(POIS.flatMap((p) => latLonToVec3(p.lat, p.lon, GRID_RADIUS))), count: POIS.length };

    return { land: { buf: this.makeBuffer(land), count }, grid, equator, diag, arcs, poi };
  }

  fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const { clientWidth: w, clientHeight: h } = this.canvas;
    if (!w || !h) return;
    this.canvas.width = Math.round(w * dpr);
    this.canvas.height = Math.round(h * dpr);
  }

  bindPointer() {
    const el = this.canvas;
    el.addEventListener('pointerdown', (ev) => {
      this.dragging = true;
      this.lastX = ev.clientX;
      el.classList.add('dragging');
      el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener('pointermove', (ev) => {
      if (!this.dragging) return;
      this.yaw += (ev.clientX - this.lastX) * 0.005;
      this.lastX = ev.clientX;
    });
    const end = () => {
      if (!this.dragging) return;
      this.dragging = false;
      el.classList.remove('dragging');
      this.resumeAt = performance.now() + 1500; // 松手 1.5s 后恢复自转
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  useCommon(prog, proj, view) {
    const { gl } = this;
    gl.useProgram(prog.program);
    gl.uniformMatrix4fv(prog.uProj, false, proj);
    gl.uniformMatrix4fv(prog.uView, false, view);
    gl.uniform1f(prog.uYaw, this.yaw);
    gl.uniform1f(prog.uScale, GLOBE_SCALE);
    gl.uniform1f(prog.uYOffset, GLOBE_Y);
    gl.uniform3f(prog.uCamera, CAMERA_POS[0], CAMERA_POS[1], CAMERA_POS[2]);
    gl.uniform1f(prog.uPixelScale, this.canvas.height / (2 * Math.tan(CAMERA_FOV / 2)));
  }

  bindAttrib(prog, buf) {
    const { gl } = this;
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(prog.aPos);
    gl.vertexAttribPointer(prog.aPos, 3, gl.FLOAT, false, 0, 0);
  }

  frame = (stamp) => {
    const dt = this.prevStamp === null ? 0 : Math.max(0, (stamp - this.prevStamp) * 0.001);
    this.prevStamp = stamp;
    if (!this.dragging && stamp > this.resumeAt) this.yaw += AUTO_SPEED * dt;

    const { gl, buffers } = this;
    const pal = this.switcher.dark ? PALETTES.dark : PALETTES.light;
    const aspect = this.canvas.width / this.canvas.height;
    const proj = perspective(CAMERA_FOV, aspect, 0.1, 100);
    const view = lookAt(CAMERA_POS, [0, GLOBE_Y, 0], [0, 1, 0]);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    gl.clearColor(pal.bg[0], pal.bg[1], pal.bg[2], pal.bg[3]);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    // 经纬网格（背面以低透明度透出）
    const lp = this.progLine;
    this.useCommon(lp, proj, view);
    gl.uniform1f(lp.uPointSize, 0);
    gl.uniform1f(lp.uBackFade, 0.35);
    gl.uniform4fv(lp.uColor, pal.grid);
    this.bindAttrib(lp, buffers.grid.buf);
    for (const s of buffers.grid.strips) gl.drawArrays(gl.LINE_STRIP, s.start, s.count);
    gl.uniform4fv(lp.uColor, pal.equator);
    this.bindAttrib(lp, buffers.equator.buf);
    gl.drawArrays(gl.LINE_STRIP, 0, buffers.equator.count);
    gl.uniform4fv(lp.uColor, pal.diag);
    this.bindAttrib(lp, buffers.diag.buf);
    for (const s of buffers.diag.strips) gl.drawArrays(gl.LINE_STRIP, s.start, s.count);

    // 陆地点阵（背面虚影）
    const pp = this.progPoint;
    this.useCommon(pp, proj, view);
    gl.uniform4fv(pp.uColor, pal.land);
    gl.uniform1f(pp.uPointSize, LAND_DOT);
    gl.uniform1f(pp.uBackFade, 0.18);
    this.bindAttrib(pp, buffers.land.buf);
    gl.drawArrays(gl.POINTS, 0, buffers.land.count);

    // 弧线（生长-消退循环动画，对应原版 setDrawRange 逻辑；背面几乎隐去）
    const t = stamp * 0.001;
    gl.useProgram(lp.program);
    gl.uniform1f(lp.uBackFade, 0.06);
    gl.uniform4fv(lp.uColor, pal.arc);
    for (const arc of buffers.arcs) {
      const k = ((t / arc.duration) + arc.phase) % 1;
      const head = easeOutCubic(clamp01(k * 2.2));
      const tail = easeOutCubic(clamp01((k - 0.55) * 2.2));
      const start = Math.floor(tail * (arc.count - 1));
      const end = Math.ceil(head * (arc.count - 1));
      if (end - start < 1) continue;
      this.bindAttrib(lp, arc.buf);
      gl.drawArrays(gl.LINE_STRIP, start, end - start + 1);
    }

    // POI 标记
    gl.useProgram(pp.program);
    gl.uniform4fv(pp.uColor, pal.poi);
    gl.uniform1f(pp.uPointSize, POI_DOT);
    gl.uniform1f(pp.uBackFade, 0.12);
    this.bindAttrib(pp, buffers.poi.buf);
    gl.drawArrays(gl.POINTS, 0, buffers.poi.count);

    requestAnimationFrame(this.frame);
  };

  start() {
    requestAnimationFrame(this.frame);
  }
}

try {
  new GlobeApp(
    document.getElementById('globe'),
    new ThemeSwitch(document.getElementById('mode-switch')),
  ).start();
} catch (err) {
  console.error(err);
}
</script>
</body>
